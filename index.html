<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görsel Üret</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1b2e 0%, #2d1b3d 100%);
    color: #f5f3f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 8px 0 16px;
    text-align: center;
  }
  .tabs {
    display: flex;
    width: 100%;
    max-width: 480px;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #c4b5fd;
  }
  .tab.active {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: white;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 18px;
    backdrop-filter: blur(10px);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  textarea {
    width: 100%;
    min-height: 90px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    color: #fff;
    padding: 12px;
    font-size: 16px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: #a78bfa; }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; }
  .upload-box {
    width: 100%;
    min-height: 120px;
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #c4b5fd;
    font-size: 14px;
    text-align: center;
    padding: 12px;
  }
  .upload-box img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    margin-top: 8px;
  }
  input[type=file] { display: none; }
  input[type=text] {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff;
    padding: 10px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .result {
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
    text-align: center;
  }
  .result img {
    width: 100%;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
    display: none;
  }
  .status {
    font-size: 14px;
    color: #c4b5fd;
    margin-top: 10px;
    min-height: 18px;
  }
  .download {
    display: none;
    margin-top: 12px;
    background: rgba(255,255,255,0.1);
  }
  .hint {
    font-size: 12px;
    color: #a89bc4;
    margin-top: 10px;
    text-align: center;
  }
  .hint a { color: #c4b5fd; }
</style>
</head>
<body>
 
<h1>🎨 Görsel Üret</h1>
 
<input type="text" id="apiKey" placeholder="Hugging Face token'ını buraya yapıştır (bir kere)">
 
<div class="tabs">
  <div class="tab active" id="tabNew" onclick="switchTab('new')">Yeni Görsel</div>
  <div class="tab" id="tabEdit" onclick="switchTab('edit')">Görsel Düzelt</div>
</div>
 
<!-- YENİ GÖRSEL -->
<div class="card panel active" id="panelNew">
  <textarea id="prompt" placeholder="Ne çizmemi istersin? (İngilizce yazarsan daha iyi sonuç alırsın)"></textarea>
  <button onclick="generate()">Görseli Oluştur</button>
</div>
 
<!-- GÖRSEL DÜZELT -->
<div class="card panel" id="panelEdit">
  <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
    <span id="uploadText">📷 Görsel yüklemek için dokun</span>
    <img id="previewImg" style="display:none;">
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
  <textarea id="editPrompt" placeholder="Görselde ne değiştirmemi istersin? (İngilizce yazarsan daha iyi sonuç alırsın)" style="margin-top:12px;"></textarea>
  <button onclick="editImage()">Görseli Düzelt</button>
</div>
 
<div class="status" id="status"></div>
 
<div class="result">
  <img id="output" alt="Oluşturulan görsel">
  <button class="download" id="downloadBtn" onclick="downloadImage()">📥 İndir</button>
</div>
 
<div class="hint">Ücretsiz — Hugging Face kullanıyor. Token almak için <a href="https://huggingface.co/settings/tokens" target="_blank">huggingface.co/settings/tokens</a> (Read yetkili token yeterli)</div>
 
<script>
let uploadedBase64 = null;
 
window.addEventListener('DOMContentLoaded', function() {
  const saved = localStorage.getItem('hf_token');
  if (saved) document.getElementById('apiKey').value = saved;
});
 
function switchTab(tab) {
  document.getElementById('tabNew').classList.toggle('active', tab === 'new');
  document.getElementById('tabEdit').classList.toggle('active', tab === 'edit');
  document.getElementById('panelNew').classList.toggle('active', tab === 'new');
  document.getElementById('panelEdit').classList.toggle('active', tab === 'edit');
  document.getElementById('status').textContent = '';
}
 
function getKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (key) localStorage.setItem('hf_token', key);
  return key;
}
 
function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    uploadedBase64 = e.target.result.split(',')[1];
    const img = document.getElementById('previewImg');
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('uploadText').style.display = 'none';
  };
  reader.readAsDataURL(file);
}
 
function setLoading(isLoading, msg) {
  document.getElementById('status').textContent = msg || '';
  document.querySelectorAll('button').forEach(b => b.disabled = isLoading);
}
 
function showResult(dataUrl) {
  const img = document.getElementById('output');
  img.src = dataUrl;
  img.style.display = 'block';
  document.getElementById('downloadBtn').style.display = 'block';
}
 
async function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
 
async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  const key = getKey();
  if (!key) {
    document.getElementById('status').textContent = 'Önce token gir 🙂';
    return;
  }
  if (!prompt) {
    document.getElementById('status').textContent = 'Lütfen önce bir şeyler yaz 🙂';
    return;
  }
  document.getElementById('output').style.display = 'none';
  document.getElementById('downloadBtn').style.display = 'none';
  setLoading(true, 'Oluşturuluyor... (ilk seferde model uyanıyor, 30-60sn sürebilir)');
 
  try {
    const response = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ inputs: prompt })
    });
 
    if (!response.ok) {
      const errText = await response.text();
      throw new Error('Sunucu hatası ' + response.status + ': ' + errText.slice(0, 150));
    }
 
    const blob = await response.blob();
    const dataUrl = await blobToDataUrl(blob);
    showResult(dataUrl);
    setLoading(false, 'Hazır ✅');
  } catch (err) {
    setLoading(false, 'Hata: ' + err.message);
  }
}
 
async function editImage() {
  const prompt = document.getElementById('editPrompt').value.trim();
  const key = getKey();
  if (!key) {
    document.getElementById('status').textContent = 'Önce token gir 🙂';
    return;
  }
  if (!uploadedBase64) {
    document.getElementById('status').textContent = 'Önce bir görsel yükle 🙂';
    return;
  }
  if (!prompt) {
    document.getElementById('status').textContent = 'Ne değiştirmemi istediğini yaz 🙂';
    return;
  }
  document.getElementById('output').style.display = 'none';
  document.getElementById('downloadBtn').style.display = 'none';
  setLoading(true, 'Düzenleniyor... (ilk seferde model uyanıyor, 30-60sn sürebilir)');
 
  try {
    const response = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-Kontext-dev', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        inputs: prompt,
        parameters: { image: uploadedBase64 }
      })
    });
 
    if (!response.ok) {
      const errText = await response.text();
      throw new Error('Sunucu hatası ' + response.status + ': ' + errText.slice(0, 150));
    }
 
    const blob = await response.blob();
    const dataUrl = await blobToDataUrl(blob);
    showResult(dataUrl);
    setLoading(false, 'Hazır ✅');
  } catch (err) {
    setLoading(false, 'Hata: ' + err.message);
  }
}
 
function downloadImage() {
  const img = document.getElementById('output');
  const link = document.createElement('a');
  link.href = img.src;
  link.download = 'gorsel.png';
  link.click();
}
</script>
 
</body>
</html>
