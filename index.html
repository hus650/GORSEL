<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görsel Üret</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1b2e 0%, #2d1b3d 100%);
    color: #f5f3f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 8px 0 20px;
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 18px;
    backdrop-filter: blur(10px);
  }
  textarea {
    width: 100%;
    min-height: 90px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    color: #fff;
    padding: 12px;
    font-size: 16px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: #a78bfa; }
  .row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  select {
    flex: 1;
    background: rgba(0,0,0,0.25);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px;
    font-size: 15px;
  }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; }
  .result {
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
    text-align: center;
  }
  .result img {
    width: 100%;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
    display: none;
  }
  .status {
    font-size: 14px;
    color: #c4b5fd;
    margin-top: 10px;
    min-height: 18px;
  }
  .download {
    display: none;
    margin-top: 12px;
    background: rgba(255,255,255,0.1);
  }
  .hint {
    font-size: 12px;
    color: #a89bc4;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>
 
<h1>🎨 Görsel Üret</h1>
 
<div class="card">
  <textarea id="prompt" placeholder="Ne çizmemi istersin? Örn: a lake in the mountains at sunset"></textarea>
  <div class="row">
    <select id="ratio">
      <option value="1024x1024">Kare</option>
      <option value="1024x1536">Dikey</option>
      <option value="1536x1024">Yatay</option>
    </select>
  </div>
  <button id="genBtn" onclick="generate()">Görseli Oluştur</button>
  <div class="status" id="status"></div>
</div>
 
<div class="result">
  <img id="output" alt="Oluşturulan görsel">
  <button class="download" id="downloadBtn" onclick="downloadImage()">📥 İndir</button>
</div>
 
<div class="hint">Ücretsiz — Pollinations.ai kullanıyor, hiçbir key/hesap gerekmez</div>
 
<script>
function generate() {
  const promptEl = document.getElementById('prompt');
  const prompt = promptEl.value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('genBtn');
  const img = document.getElementById('output');
  const downloadBtn = document.getElementById('downloadBtn');
 
  if (!prompt) {
    status.textContent = 'Lütfen önce bir şeyler yaz 🙂';
    return;
  }
 
  const [w, h] = document.getElementById('ratio').value.split('x');
  const seed = Math.floor(Math.random() * 1000000);
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&seed=${seed}&nologo=true`;
 
  btn.disabled = true;
  status.textContent = 'Oluşturuluyor... (10-20 saniye sürebilir)';
  img.style.display = 'none';
  downloadBtn.style.display = 'none';
 
  const testImg = new Image();
  testImg.onload = function() {
    img.src = url;
    img.style.display = 'block';
    downloadBtn.style.display = 'block';
    status.textContent = 'Hazır ✅';
    btn.disabled = false;
  };
  testImg.onerror = function() {
    status.textContent = 'Bir hata oldu, tekrar dene.';
    btn.disabled = false;
  };
  testImg.src = url;
}
 
function downloadImage() {
  const img = document.getElementById('output');
  const link = document.createElement('a');
  link.href = img.src;
  link.download = 'gorsel.jpg';
  link.target = '_blank';
  link.click();
}
</script>
 
</body>
</html>
